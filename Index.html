
<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAWID VOICE AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#050b18;
 color:white;
 text-align:center;
 padding:25px 15px;
}
.container{
 max-width:500px;
 margin:35px auto;
 padding:25px;
 background:#101d35;
 border:1px solid #1769d2;
 border-radius:22px;
 box-shadow:0 0 25px #0753a855;
}
h1{color:#42a5ff;font-size:30px}
.tag{color:#a9c8ec}
textarea{
 width:100%;
 height:130px;
 padding:15px;
 border-radius:12px;
 border:1px solid #398ee8;
 background:#071326;
 color:white;
 font-size:17px;
 margin:15px 0;
}
button{
 width:100%;
 padding:14px;
 margin:7px 0;
 border:0;
 border-radius:12px;
 background:#0878ed;
 color:white;
 font-size:17px;
 font-weight:bold;
}
button:active{background:#0454a8}
#result{color:#55c5ff;min-height:25px}
footer{color:#7894b8;font-size:13px;margin-top:25px}
</style>
</head>
<body>
<div class="container">
<h1>JAWID VOICE AI</h1>
<p class="tag">Your Smart Voice & Translation Assistant</p>

<textarea id="message" placeholder="دلته خپله خبره ولیکئ..."></textarea>

<button onclick="listen()">🎤 Speak</button>
<button onclick="translateText()">🌍 Translate to English</button>
<button onclick="speakText()">🔊 Read Aloud</button>

<p id="result">Welcome to JAWID VOICE AI</p>
</div>

<footer>© 2026 JAWID VOICE AI</footer>

<script>
function listen(){
 const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!Speech){
  document.getElementById("result").innerText="Speech recognition is not supported in this browser.";
  return;
 }
 const recognition = new Speech();
 recognition.lang="ps-AF";
 recognition.onresult=function(event){
  document.getElementById("message").value=event.results[0][0].transcript;
 };
 recognition.onerror=function(){
  document.getElementById("result").innerText="Voice error. Please try again.";
 };
 recognition.start();
}
function translateText(){
 document.getElementById("result").innerText=
 "AI translation service must be connected to enable translation.";
}
function speakText(){
 const text=document.getElementById("message").value;
 if(!text){alert("Please write something first.");return;}
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang="ps-AF";
 speechSynthesis.speak(speech);
}
</script>
</body>
</html>
